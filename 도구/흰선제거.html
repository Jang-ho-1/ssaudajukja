<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흰선 지우개</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --sub:#667085; --line:#d8dde6; --acc:#1f7a4d; --acc2:#e8f5ee; --warn:#b54708; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1d2128; --ink:#e8ebf0; --sub:#98a2b3; --line:#323844; --acc:#3fbf7f; --acc2:#1c2e25; --warn:#f79009; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--sub); margin:0 0 18px; }
  #drop { border:2px dashed var(--line); border-radius:14px; background:var(--card); padding:36px 16px; text-align:center; cursor:pointer; transition:.15s; }
  #drop.on { border-color:var(--acc); background:var(--acc2); }
  #drop b { font-size:17px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0; }
  button { font:inherit; padding:9px 16px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.main { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  label.opt { display:flex; gap:6px; align-items:center; color:var(--sub); }
  #status { color:var(--sub); }
  #status.warn { color:var(--warn); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
  .pair img { width:100%; aspect-ratio:1; object-fit:contain; background:#00b140; border-radius:6px; }
  .name { font-size:13px; color:var(--sub); margin-top:6px; word-break:break-all; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .2s; }
</style>
</head>
<body>
<main>
  <h1>흰선 지우개</h1>
  <p class="sub">초록 바탕 캐릭터 그림의 흰 테두리만 지워요. 원본 파일은 건드리지 않고, 고른 폴더에 같은 이름(.png)으로 저장해요.</p>

  <div id="drop">
    <b>여기에 사진을 끌어다 놓으세요</b><br>
    <span class="sub">여러 장 한 번에 · 폴더째 끌어 놓아도 돼요 · 클릭하면 파일 고르기</span>
    <input id="pick" type="file" accept="image/*" multiple hidden>
  </div>

  <div class="row">
    <button id="saveDir" class="main" disabled>폴더 골라서 저장</button>
    <button id="saveZip" disabled>ZIP으로 받기</button>
    <button id="clear" disabled>비우기</button>
    <label class="opt"><input id="dark" type="checkbox" checked> 가장자리 회색 번짐을 선 색으로 정리</label>
  </div>
  <div id="status">사진을 넣으면 바로 흰 선을 지워서 아래에 보여 줘요. (왼쪽 원본 · 오른쪽 결과)</div>
  <div class="bar"><i id="prog"></i></div>
  <div id="grid" style="margin-top:14px"></div>
</main>

<script>
// ── 흰 테두리 지우기 (도구/흰선제거.py 와 같은 방식) ──
//   바탕(왼쪽 위 구석 색)에서 시작해 붙어 있는 흰색 · 흰+초록 섞인 점을 지우고, 진한 선을 만나면 멈춤
//   1~2px 회색 선 뒤에 숨은 흰 조각도 건너가서 지움 · 안쪽 흰색(눈 흰자 · 흰 옷)은 그대로
function dilate(m, w, h, n) {
  let cur = m;
  for (let k = 0; k < n; k++) {
    const out = cur.slice();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (cur[i]) continue;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy; if (yy < 0 || yy >= h) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx; if (xx < 0 || xx >= w) continue;
          if (cur[yy * w + xx]) { out[i] = 1; dy = 2; break; }
        }
      }
    }
    cur = out;
  }
  return cur;
}

function removeOutline(img, darken) {
  const w = img.width, h = img.height, d = img.data, N = w * h;
  const cs = [[], [], []];
  for (let y = 0; y < Math.min(20, h); y++) for (let x = 0; x < Math.min(20, w); x++) {
    const p = (y * w + x) * 4; cs[0].push(d[p]); cs[1].push(d[p + 1]); cs[2].push(d[p + 2]);
  }
  const med = a => { a.sort((p, q) => p - q); return a[a.length >> 1]; };
  const br = med(cs[0]), bgc = med(cs[1]), bb = med(cs[2]);
  const dx = 255 - br, dy = 255 - bgc, dz = 255 - bb, dd = dx * dx + dy * dy + dz * dz || 1;

  const cur = new Uint8Array(N), light = new Uint8Array(N), white = new Uint8Array(N),
        gray = new Uint8Array(N), softc = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), lum = r * .3 + g * .59 + b * .11;
    if (Math.abs(r - br) + Math.abs(g - bgc) + Math.abs(b - bb) < 70) cur[i] = 1;
    let t = ((r - br) * dx + (g - bgc) * dy + (b - bb) * dz) / dd; t = t < 0 ? 0 : t > 1 ? 1 : t;
    const off = Math.abs(r - (br + t * dx)) + Math.abs(g - (bgc + t * dy)) + Math.abs(b - (bb + t * dz));
    if (off < 75 || (mn > 140 && mx - mn < 70)) light[i] = 1;
    if (mn > 190 && mx - mn < 45) white[i] = 1;
    if (lum > 100 && mx - mn < 60) gray[i] = 1;
    if (lum > 60 && mx - mn < 60) softc[i] = 1;
  }

  const q = new Int32Array(N);
  function flood(mask) {
    let head = 0, tail = 0;
    for (let i = 0; i < N; i++) if (cur[i]) q[tail++] = i;
    while (head < tail) {
      const i = q[head++], x = i % w, y = (i / w) | 0;
      for (let yy = y - 1; yy <= y + 1; yy++) {
        if (yy < 0 || yy >= h) continue;
        for (let xx = x - 1; xx <= x + 1; xx++) {
          if (xx < 0 || xx >= w) continue;
          const j = yy * w + xx;
          if (!cur[j] && mask[j]) { cur[j] = 1; q[tail++] = j; }
        }
      }
    }
  }
  for (let k = 0; k < 4; k++) {
    flood(light);
    const D = dilate(cur, w, h, 3);
    let added = false;
    for (let i = 0; i < N; i++) if (D[i] && !cur[i] && white[i]) { cur[i] = 1; added = true; }
    if (!added) break;
    for (let i = 0; i < N; i++) if (white[i]) light[i] = 1;
    if (k === 3) flood(light);
  }
  for (let k = 0; k < 3; k++) {
    const D = dilate(cur, w, h, 1);
    let added = false;
    for (let i = 0; i < N; i++) if (D[i] && !cur[i] && gray[i]) { cur[i] = 1; added = true; }
    if (!added) break;
  }
  if (darken) {
    const D = dilate(cur, w, h, 1);
    for (let i = 0; i < N; i++) if (D[i] && !cur[i] && softc[i]) {
      d[i * 4] *= .45; d[i * 4 + 1] *= .45; d[i * 4 + 2] *= .45;
    }
  }
  for (let i = 0; i < N; i++) if (cur[i]) { d[i * 4] = br; d[i * 4 + 1] = bgc; d[i * 4 + 2] = bb; d[i * 4 + 3] = 255; }
  return img;
}

// ── 화면 ──
const $ = id => document.getElementById(id);
const results = [];   // { name, blob }
const sleep = () => new Promise(r => setTimeout(r, 0));
let busy = 0, total = 0, done = 0;

function setStatus(t, warn) { $('status').textContent = t; $('status').className = warn ? 'warn' : ''; }
function refresh() {
  const ok = results.length > 0 && busy === 0;
  $('saveDir').disabled = !ok; $('saveZip').disabled = !ok; $('clear').disabled = results.length === 0 && busy === 0;
  $('prog').style.width = total ? (done / total * 100) + '%' : '0';
}

async function handle(files) {
  files = files.filter(f => /\.(png|webp|jpe?g)$/i.test(f.name));
  if (!files.length) { setStatus('그림 파일(png · webp · jpg)이 없어요.', true); return; }
  total += files.length; busy += files.length; refresh();
  for (const f of files) {
    setStatus(`지우는 중… ${done + 1} / ${total}  (${f.name})`);
    await sleep();
    try {
      const bmp = await createImageBitmap(f);
      const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
      const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(bmp, 0, 0);
      const data = removeOutline(x.getImageData(0, 0, c.width, c.height), $('dark').checked);
      x.putImageData(data, 0, 0);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      const name = f.name.replace(/\.[^.]+$/, '') + '.png';
      results.push({ name, blob });
      const it = document.createElement('div'); it.className = 'item';
      it.innerHTML = `<div class="pair"><img alt="원본"><img alt="결과"></div><div class="name"></div>`;
      it.querySelectorAll('img')[0].src = URL.createObjectURL(f);
      it.querySelectorAll('img')[1].src = URL.createObjectURL(blob);
      it.querySelector('.name').textContent = name;
      $('grid').appendChild(it);
    } catch (e) { console.error(e); setStatus(`${f.name} : 열 수 없는 파일이에요.`, true); }
    done++; busy--; refresh();
  }
  setStatus(`${results.length}장 완료. «폴더 골라서 저장»을 누르고 새 폴더(예: 군인 착용2)를 만들어 고르세요.`);
}

// 폴더째 끌어 놓기
async function readEntry(entry, out) {
  if (entry.isFile) out.push(await new Promise((ok, no) => entry.file(ok, no)));
  else if (entry.isDirectory) {
    const rd = entry.createReader();
    for (;;) {
      const ents = await new Promise((ok, no) => rd.readEntries(ok, no));
      if (!ents.length) break;
      for (const e of ents) await readEntry(e, out);
    }
  }
}
const drop = $('drop');
drop.onclick = () => $('pick').click();
$('pick').onchange = e => { handle([...e.target.files]); e.target.value = ''; };
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('on'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('on'); }));
drop.addEventListener('drop', async e => {
  const items = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const files = [];
  if (items.length) for (const en of items) await readEntry(en, files);
  else files.push(...e.dataTransfer.files);
  handle(files);
});

$('saveDir').onclick = async () => {
  if (!window.showDirectoryPicker) { setStatus('이 브라우저는 폴더 저장을 못 해요. 크롬이나 엣지로 열거나 «ZIP으로 받기»를 쓰세요.', true); return; }
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    let n = 0;
    for (const r of results) {
      const fh = await dir.getFileHandle(r.name, { create: true });
      const ws = await fh.createWritable(); await ws.write(r.blob); await ws.close();
      n++; setStatus(`저장 중… ${n} / ${results.length}`);
    }
    setStatus(`«${dir.name}» 폴더에 ${n}장 저장했어요. 원본 파일은 그대로예요.`);
  } catch (e) { if (e.name !== 'AbortError') setStatus('저장하지 못했어요: ' + e.message, true); }
};
$('saveZip').onclick = async () => {
  if (!window.JSZip) { setStatus('인터넷이 연결돼야 ZIP을 만들 수 있어요. «폴더 골라서 저장»을 쓰세요.', true); return; }
  const z = new JSZip(); results.forEach(r => z.file(r.name, r.blob));
  const blob = await z.generateAsync({ type: 'blob' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '흰선없음.zip'; a.click();
};
$('clear').onclick = () => { results.length = 0; total = done = 0; $('grid').innerHTML = ''; setStatus('비웠어요.'); refresh(); };
</script>
</body>
</html>
