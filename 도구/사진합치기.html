<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 합치기</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --ink:#1b2230; --sub:#5f6b7d; --line:#dde2ea; --acc:#16794a; --acc-ink:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151a; --card:#1b1f26; --ink:#e7eaf0; --sub:#9aa4b4; --line:#2e3440; --acc:#35b877; --acc-ink:#0d1a12; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--sub); font-size:14px; }
  #drop { border:2px dashed var(--line); border-radius:14px; background:var(--card); padding:36px 16px; text-align:center; cursor:pointer; margin:18px 0 14px; }
  #drop.on { border-color:var(--acc); }
  .row { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin:10px 0; }
  label { display:flex; gap:6px; align-items:center; }
  select, input[type=number] { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
  button { font:inherit; padding:9px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.main { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:700; }
  button:disabled { opacity:.45; cursor:default; }
  #msg { margin:8px 0; font-weight:600; }
  #out { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; margin-top:12px; }
  #out figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; }
  #out img { width:100%; border-radius:6px; display:block; }
  #out figcaption { font-size:13px; color:var(--sub); margin-top:4px; }
</style>
</head>
<body>
<main>
  <h1>사진 합치기</h1>
  <div class="sub">틀 사진 수백 장을 «서 있는 자세» 한두 장으로 모아요. 사진 여러 장(폴더째도 돼요)을 몇 장의 «모음 사진»으로 합쳐요. 사진마다 아래에 파일 이름이 적혀서, Claude 에게 보내면 어떤 파일인지 알 수 있어요.</div>

  <div id="drop"><b>여기에 사진이나 폴더를 끌어다 놓으세요</b><br><span class="sub">클릭하면 파일 고르기</span><input id="pick" type="file" accept="image/*" multiple hidden></div>

  <div class="row">
    <label><input id="first" type="checkbox" checked> 틀 사진은 첫 칸(서 있는 자세)만</label>
    <label>한 장에 <select id="per"><option>9</option><option>16</option><option>25</option><option>36</option><option selected>49</option><option>64</option><option>100</option></select> 개씩</label>
    <label>모음 사진 크기 <select id="size"><option value="1600">1600px</option><option value="2000" selected>2000px</option><option value="2600">2600px</option></select></label>
    <button id="make" class="main" disabled>합치기</button>
    <button id="save" disabled>전부 저장 (폴더 고르기)</button>
  </div>
  <div id="msg" class="sub">사진을 넣어 주세요.</div>
  <div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let files = [], sheets = [];
const IMG = /\.(png|webp|jpe?g)$/i;

async function readEntry(en, out, path) {
  if (en.isFile) { const f = await new Promise((a, b) => en.file(a, b)); f._path = path + f.name; out.push(f); }
  else if (en.isDirectory) { const r = en.createReader(); for (;;) { const es = await new Promise((a, b) => r.readEntries(a, b)); if (!es.length) break; for (const e of es) await readEntry(e, out, path + en.name + '/'); } }
}
function add(list) {
  files = files.concat(list.filter(f => IMG.test(f.name)));
  files.sort((a, b) => (a._path || a.name).localeCompare(b._path || b.name, 'ko', { numeric: true }));
  $('msg').textContent = `사진 ${files.length}장 · «합치기»를 누르세요.`; $('make').disabled = !files.length;
}
const drop = $('drop');
drop.onclick = () => $('pick').click();
$('pick').onchange = e => { add([...e.target.files]); e.target.value = ''; };
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('on'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('on'); }));
drop.addEventListener('drop', async e => {
  const ens = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean), out = [];
  if (ens.length) for (const en of ens) await readEntry(en, out, ''); else out.push(...e.dataTransfer.files);
  add(out);
});

// 틀 사진 → 첫 칸(왼쪽 위 캐릭터)만 : 왼쪽 위 1/4 × 1/3 자리에서 바탕(구석 색)이 아닌 곳만 잘라 냄
async function firstCell(bmp) {
  const W = bmp.width, H = bmp.height, cw = Math.round(W / 4), chh = Math.round(H / 3);
  if (W < 600 || H < 400) return bmp;                                     // 작은 사진은 그대로
  const c = document.createElement('canvas'); c.width = cw; c.height = chh; const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(bmp, 0, 0);
  const d = g.getImageData(0, 0, cw, chh).data, br = d[0], bg = d[1], bb = d[2];
  const fg = (x, y) => { const i = (y * cw + x) * 4; return d[i + 3] > 20 && Math.abs(d[i] - br) + Math.abs(d[i + 1] - bg) + Math.abs(d[i + 2] - bb) > 90; };
  const rowOn = []; for (let y = 0; y < chh; y++) { let n = 0; for (let x = 0; x < cw; x += 2) if (fg(x, y)) n++; rowOn.push(n > 1); }
  let ys = rowOn.indexOf(true), ye = ys;                                   // 위에서 첫 덩어리만 (빈 줄이 12px 넘게 이어지면 거기서 끊음 · 아랫줄 캐릭터 머리 안 들어오게)
  if (ys >= 0) { let gap = 0; for (let y = ys; y < chh; y++) { if (rowOn[y]) { ye = y; gap = 0; } else if (++gap > 12) break; } }
  let x0 = cw, y0 = chh, x1 = 0, y1 = 0;
  if (ys >= 0) for (let y = ys; y <= ye; y += 2) for (let x = 0; x < cw; x += 2) if (fg(x, y)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 <= x0 || y1 <= y0) { bmp.close(); return createImageBitmap(c); }
  const pad = 6; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(cw, x1 + pad); y1 = Math.min(chh, y1 + pad);
  const o = await createImageBitmap(c, x0, y0, x1 - x0, y1 - y0); bmp.close(); return o;
}
$('make').onclick = async () => {
  const per = +$('per').value, W = +$('size').value, cols = Math.ceil(Math.sqrt(per)), rows = Math.ceil(per / cols);
  const cw = Math.floor(W / cols), lab = Math.max(16, Math.min(34, Math.round(cw / 7))), ch = Math.floor(cw * ($('first').checked ? 1.25 : 0.78)) + lab;
  sheets.forEach(s => URL.revokeObjectURL(s.url)); sheets = []; $('out').innerHTML = ''; $('make').disabled = true;
  for (let s = 0; s * per < files.length; s++) {
    const part = files.slice(s * per, s * per + per), r = Math.ceil(part.length / cols);
    const c = document.createElement('canvas'); c.width = cols * cw; c.height = r * ch;
    const g = c.getContext('2d'); g.fillStyle = '#2b2f3a'; g.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < part.length; i++) {
      $('msg').textContent = `합치는 중… ${s * per + i + 1} / ${files.length}`;
      const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
      try {
        let bmp = await createImageBitmap(part[i]); if ($('first').checked) bmp = await firstCell(bmp); const bw = cw - 12, bh = ch - lab - 12, k = Math.min(bw / bmp.width, bh / bmp.height);
        const dw = bmp.width * k, dh = bmp.height * k; g.drawImage(bmp, x + (cw - dw) / 2, y + 6 + (bh - dh) / 2, dw, dh); bmp.close();
      } catch (e) {}
      g.strokeStyle = '#555c6e'; g.strokeRect(x + .5, y + .5, cw - 1, ch - 1);
      g.fillStyle = '#ffe36a'; g.font = '600 ' + Math.round(lab * 0.6) + 'px system-ui, "Malgun Gothic", sans-serif'; g.textBaseline = 'middle';
      let name = part[i]._path || part[i].name; while (g.measureText(name).width > cw - 16 && name.length > 4) name = '…' + name.slice(2);
      g.fillText(name, x + 8, y + ch - lab / 2);
    }
    const blob = await new Promise(a => c.toBlob(a, 'image/jpeg', 0.9)), url = URL.createObjectURL(blob), nm = `모음_${String(s + 1).padStart(2, '0')}.jpg`;
    sheets.push({ blob, url, nm });
    const fg = document.createElement('figure'); fg.innerHTML = `<a target="_blank"><img alt=""></a><figcaption></figcaption>`;
    fg.querySelector('a').href = url; fg.querySelector('img').src = url; fg.querySelector('figcaption').textContent = `${nm} · ${part.length}장`;
    $('out').appendChild(fg);
  }
  $('msg').textContent = `모음 사진 ${sheets.length}장 완료. «전부 저장»으로 폴더에 저장한 뒤 Claude 대화창에 끌어다 놓으세요.`;
  $('make').disabled = false; $('save').disabled = !sheets.length;
};
$('save').onclick = async () => {
  if (!window.showDirectoryPicker) { sheets.forEach(s => { const a = document.createElement('a'); a.href = s.url; a.download = s.nm; a.click(); }); return; }
  try { const d = await window.showDirectoryPicker({ mode: 'readwrite' });
    for (const s of sheets) { const fh = await d.getFileHandle(s.nm, { create: true }), w = await fh.createWritable(); await w.write(s.blob); await w.close(); }
    $('msg').textContent = `«${d.name}» 폴더에 ${sheets.length}장 저장했어요.`;
  } catch (e) { if (e.name !== 'AbortError') $('msg').textContent = '저장 실패: ' + e.message; }
};
</script>
</body>
</html>
